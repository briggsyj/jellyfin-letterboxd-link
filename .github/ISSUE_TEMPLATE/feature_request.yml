name: Feature request
description: Suggest an improvement or new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is a deliberately small, low-maintenance plugin. Ideas that keep
        it that way are most likely to land - see the "out of scope" notes in
        the README/CONTRIBUTING for things that have been intentionally left out.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The motivation or use case, rather than the solution itself.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like the plugin to do.
    validations:
      required: true
