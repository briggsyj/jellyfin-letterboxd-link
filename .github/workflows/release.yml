name: Release Plugin

# Builds a Jellyfin-installable plugin zip and attaches it (plus its
# checksum and meta.json) to a GitHub Release. Runs automatically when a
# release is published, or manually via workflow_dispatch to sanity-check
# the build without publishing anything.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version to build (e.g. 1.0.1.0). Defaults to the version in build.yaml.'
        required: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Determine plugin version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            version="${{ github.event.release.tag_name }}"
          else
            version=""
          fi
          # jprm expects a plain numeric version (e.g. 1.0.1.0); strip a
          # leading "v" if the tag/input used one (e.g. "v1.0.1.0").
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build plugin package
        id: build
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          path: .
          output: ./artifacts
          version: ${{ steps.version.outputs.version }}
          dotnet-config: Release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: |
            artifacts/*.zip
            artifacts/*.md5sum
            artifacts/*.meta.json
          if-no-files-found: error

      - name: Attach artifacts to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.md5sum
            artifacts/*.meta.json

      - name: Publish plugin repository manifest to GitHub Pages
        if: github.event_name == 'release'
        env:
          PIP_BREAK_SYSTEM_PACKAGES: '1'
        run: |
          set -euo pipefail

          python3 -m pip install --quiet jprm

          pages_url="https://$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]').github.io/${GITHUB_REPOSITORY#*/}"

          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            # -B (re)creates the local gh-pages branch pointing at the remote
            # tip, so the later `git push origin gh-pages` has a real local
            # branch ref to push (a plain detached checkout wouldn't).
            git worktree add -B gh-pages gh-pages origin/gh-pages
          else
            # First release ever: no gh-pages branch upstream yet. The
            # orphan branch is named after the worktree path (gh-pages).
            git worktree add --orphan gh-pages
          fi

          if [ ! -f gh-pages/manifest.json ]; then
            jprm --verbosity=info repo init gh-pages
          fi

          jprm --verbosity=info repo add --url="${pages_url}" gh-pages artifacts/*.zip

          cd gh-pages
          git add .
          if git diff --cached --quiet; then
            echo "No manifest changes to publish."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Publish ${{ steps.version.outputs.version }}"
            git push origin gh-pages
          fi
