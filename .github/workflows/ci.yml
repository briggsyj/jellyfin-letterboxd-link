name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  dotnet-test:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./test-results

      - name: .NET test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: .NET Tests
          path: 'test-results/*.trx'
          reporter: dotnet-trx

  script-test:
    name: Injected script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          mkdir -p test-results

          # Run tests without letting a test failure short-circuit the rest
          # of this script (the default `bash -e` would skip the junit.xml
          # fix-up below), but still fail the step afterwards if tests failed.
          set +e
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/junit.xml
          test_exit_code=$?
          set -e

          # Node's built-in junit reporter puts <testcase> elements directly
          # under <testsuites> with no <testsuite> wrapper, which isn't valid
          # JUnit XML and dorny/test-reporter's java-junit parser silently
          # reports "no tests found" for it. Wrap them so it parses correctly.
          node -e "
            const fs = require('node:fs');
            const path = 'test-results/junit.xml';
            let xml = fs.readFileSync(path, 'utf8');
            xml = xml
              .replace('<testsuites>', '<testsuites>\n<testsuite name=\"letterboxd-link\">')
              .replace('</testsuites>', '</testsuite>\n</testsuites>');
            fs.writeFileSync(path, xml);
          "

          exit $test_exit_code

      - name: JS test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: JS Tests
          path: 'test-results/junit.xml'
          reporter: java-junit
